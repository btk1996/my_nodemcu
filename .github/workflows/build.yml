name: CI

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ dev, release ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      LUA: 53
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - run: pip install pyserial
    - run: sudo apt install srecord
    - name: Build firmware
      run: make
    - name: Upload luac.cross
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: luac.cross_53_float
        path: luac.cross
