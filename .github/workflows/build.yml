name: CI

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ dev, release ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LUA: 53

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    
    - name: Install dependencies
      run: |
        pip install pyserial
        sudo apt install srecord
        
    - name: Build firmware (Lua 5.3, float)
      run: make
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: luac.cross_53_float
        path: luac.cross
        
    - name: Push binary to repository
      run: |
        # Clone the repository
        git clone https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo
        cd repo
        
        # Configure Git
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # Switch to bin branch
        git checkout -b bin || git checkout bin
        
        # Copy the built binary
        mkdir -p firmware_builds
        cp ../luac.cross firmware_builds/luac.cross_53_float
        
        # Commit and push
        git add firmware_builds/
        git commit -m "Update firmware build (Lua 5.3, float) [skip ci]"
        git push origin bin
