name: my build

on:
  workflow_dispatch:  # Включает ручной запуск из интерфейса GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LUA: 51

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - run: pip install pyserial
      #shell: bash
    - run: sudo apt install srecord
      #shell: bash
    - name: Build firmware
      run: make
      #shell: bash
    - name: Upload firmware
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: firmware_51_float.bin
        path: bin
