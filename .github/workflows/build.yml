name: CI

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ dev, release ]

jobs:


  build:
    strategy:
      fail-fast: false
      matrix:
        lua_ver: [51, 53]
        numbers: ['float']
        include:
          - lua_ver: 51
            numbers: 'integral'  
          - lua_ver: 53
            numbers: '64bit'  
    runs-on: ubuntu-latest

    env:
      LUA: ${{ matrix.lua_ver }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - run: pip install pyserial
      shell: bash
    - run: sudo apt install srecord
      shell: bash
    - name: Build firmware
      if: matrix.numbers == 'float'
      run: make
      shell: bash
    - name: Build integral firmware
      if: ${{ matrix.numbers == 'integral' }}
      run: |
        make EXTRA_CCFLAGS="-DLUA_NUMBER_INTEGRAL"
        mv luac.cross.int luac.cross
      shell: bash
    - name: Build 64bit firmware
      if: ${{ matrix.numbers == '64bit' }}
      run: |
        make EXTRA_CCFLAGS="-DLUA_NUMBER_64BITS"
      shell: bash
    - name: Upload luac.cross
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: luac.cross_${{ matrix.lua_ver }}_${{ matrix.numbers }}
        path: luac.cross
