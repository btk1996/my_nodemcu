name: Build NodeMCU Float Firmware

on:
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout NodeMCU firmware
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Build firmware (float)
      run: |
        docker run --rm -v "$PWD:/opt/nodemcu-firmware" -w /opt/nodemcu-firmware \
          marcelstoer/nodemcu-build \
          make

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: nodemcu-firmware-float
        path: bin/nodemcu_float_*.bin
